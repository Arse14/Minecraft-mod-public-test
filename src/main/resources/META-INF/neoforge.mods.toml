# Metadonnees de chargement du mod (format TOML).
# Les valeurs entre accolades sont remplacees depuis gradle.properties au moment du build.
# NB : ce fichier passe par un moteur de template Groovy, ne jamais ecrire de dollar-accolade
# en dehors d'un vrai nom de propriete.

modLoader="javafml" #obligatoire
loaderVersion="${loader_version_range}" #obligatoire
license="${mod_license}"
issueTrackerURL="https://github.com/Arse14/Minecraft-mod-public-test/issues" #optionnel

[[mods]] #obligatoire
modId="${mod_id}" #obligatoire
version="${mod_version}" #obligatoire
displayName="${mod_name}" #obligatoire
displayURL="https://github.com/Arse14/Minecraft-mod-public-test" #optionnel
#logoFile="cobolmod.png" #optionnel
authors="Arse14"
description='''
Ellyzhia - mod NeoForge pour Minecraft 1.21.1.
'''

# Dependance : NeoForge
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

# Dependance : Minecraft
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
