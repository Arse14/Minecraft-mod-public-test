# Mémoire allouée à Gradle. Peut être surchargé par l'utilisateur ou en ligne de commande.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Mappings Parchment (noms de paramètres lisibles dans le code de Minecraft)
# https://parchmentmc.org/docs/getting-started
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

## Environnement

# Version de Minecraft ciblée
minecraft_version=1.21.1
# Plage de versions de Minecraft acceptées par le mod
minecraft_version_range=[1.21.1]
# Version de NeoForge (doit correspondre à la version de Minecraft)
# Dernières versions : https://projects.neoforged.net/neoforged/neoforge
neo_version=21.1.235
# Plage de versions du loader FML
loader_version_range=[1,)

## Propriétés du mod

# Identifiant unique du mod : minuscules, regex [a-z][a-z0-9_]{1,63}
# Doit correspondre à la constante MODID de la classe principale annotée @Mod.
mod_id=cobolmod
# Nom affiché du mod
mod_name=Ellyzhia
# Licence du mod (https://choosealicense.com/)
mod_license=All Rights Reserved
# Version du mod (https://semver.org/)
mod_version=0.1.0
# Group ID (package de base du mod)
mod_group_id=com.ellyzhia.cobolmod
