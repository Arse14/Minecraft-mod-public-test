name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      # En cas d'échec, remonte les lignes d'erreur en annotations (visibles sans ouvrir le log)
      - name: Report build errors
        if: failure()
        run: |
          { grep -nE "error:|symbol:|location:|\.java:[0-9]+" build.log | head -40;
            grep -n -A 25 "What went wrong" build.log | head -60; } \
            | while IFS= read -r line; do echo "::error::${line}"; done

      # Le .jar du mod est téléchargeable depuis l'onglet Actions > ce run > Artifacts
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: cobolmod-jar
          path: build/libs/*.jar
          if-no-files-found: error
